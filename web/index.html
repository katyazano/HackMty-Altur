<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altur Banking - Voice Anti-Spoofing Benchmark</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    input[type=range] {
      accent-color: #3b82f6;
    }
    audio {
      width: 100%;
      height: 38px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-12">

  <!-- Navigation Bar -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2 rounded-lg text-white">
          <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white">Altur Banking</h1>
          <p class="text-xs text-blue-400 font-medium">AI Voice Anti-Spoofing & Deepfake Detection Benchmark</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <span id="status-badge" class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-semibold flex items-center gap-1.5">
          <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span> Ready
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- LEFT COLUMN: AUDIO UPLOAD (4 cols) -->
      <div class="lg:col-span-4 space-y-6">

        <!-- Audio Upload Card -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-5 shadow-lg space-y-4">
          <h2 class="font-bold text-white flex items-center gap-2 border-b border-slate-700 pb-3">
            <i class="fa-solid fa-cloud-arrow-up text-indigo-400"></i> Add New Audio File
          </h2>
          <form id="upload-form" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Speaker Tag / Name</label>
              <input type="text" id="upload-label" placeholder="e.g., test_voice_sample" required class="w-full px-3 py-1.5 text-sm bg-slate-900 border border-slate-700 rounded-md focus:outline-none focus:border-blue-500 text-white">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Ground Truth (Correct Answer)</label>
              <select id="upload-gt" class="w-full px-3 py-1.5 text-xs bg-slate-900 border border-slate-700 rounded-md focus:outline-none focus:border-blue-500 text-white">
                <option value="AUTO">Auto-Detect from Name</option>
                <option value="REAL_HUMAN">Real Human Voice (Bonafide)</option>
                <option value="FAKE_SPOOF">Fake / Synthetic AI Voice (Spoof)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Select Audio File (.ogg, .wav, .mp3, .flac)</label>
              <input type="file" id="upload-file" accept="audio/*" required class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
            </div>
            <button type="submit" id="btn-upload" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-white font-semibold text-sm rounded-lg transition flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-plus"></i> Upload & Add to Pipeline
            </button>
          </form>
        </div>

      </div>

      <!-- RIGHT COLUMN: PLAYERS & RESULTS TABLES (8 cols) -->
      <div class="lg:col-span-8 space-y-6">

        <!-- 2-Way Model Benchmark Card (RawNet2 vs AASIST) -->
        <div class="bg-slate-800 rounded-xl border border-indigo-500/40 p-5 shadow-xl space-y-4">
          <div class="flex items-center justify-between border-b border-slate-700 pb-3">
            <div class="flex items-center gap-2">
              <div class="bg-indigo-600/30 text-indigo-400 p-1.5 rounded-lg">
                <i class="fa-solid fa-chart-simple text-sm"></i>
              </div>
              <div>
                <h2 class="font-bold text-white text-base">Anti-Spoofing Deep Learning Benchmark</h2>
                <p class="text-xs text-slate-400">Comparing Predictions against Ground Truth (Correct Answer)</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="px-2.5 py-0.5 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded text-xs font-mono font-semibold">
                2 Models Active
              </span>
              <button id="btn-delete-all" class="text-xs text-rose-400 hover:text-white bg-rose-500/10 hover:bg-rose-600 border border-rose-500/30 px-2.5 py-1 rounded transition flex items-center gap-1">
                <i class="fa-solid fa-trash-can text-[10px]"></i> Delete All
              </button>
            </div>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-300">
              <thead class="bg-slate-900/80 text-slate-400 uppercase font-semibold border-b border-slate-700">
                <tr>
                  <th class="py-2.5 px-3">Audio Sample</th>
                  <th class="py-2.5 px-3">Listen</th>
                  <th class="py-2.5 px-3 text-purple-400">Ground Truth</th>
                  <th class="py-2.5 px-3 text-amber-400">1. RawNet2</th>
                  <th class="py-2.5 px-3 text-emerald-400">2. AASIST-L</th>
                  <th class="py-2.5 px-3 text-right">Action</th>
                </tr>
              </thead>
              <tbody id="benchmark-table-body" class="divide-y divide-slate-700/50">
                <!-- Populated dynamically -->
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script>
    // Fetch and render data
    async function loadData() {
      try {
        const res = await fetch('/api/data');
        const data = await res.json();
        renderDashboard(data);
      } catch (err) {
        console.error('Error fetching data:', err);
      }
    }

    // Delete Single Audio
    async function deleteSingleAudio(filename) {
      if (!confirm(`Are you sure you want to delete ${filename}?`)) return;
      try {
        const res = await fetch(`/api/audio/${encodeURIComponent(filename)}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        renderDashboard(data);
      } catch (err) {
        console.error('Delete failed:', err);
      }
    }

    // Delete All Audios
    document.getElementById('btn-delete-all').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to delete ALL audio files?')) return;
      try {
        const res = await fetch('/api/audios/all', {
          method: 'DELETE'
        });
        const data = await res.json();
        renderDashboard(data);
      } catch (err) {
        console.error('Delete all failed:', err);
      }
    });

    // File Upload Handler
    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const label = document.getElementById('upload-label').value;
      const gt = document.getElementById('upload-gt').value;
      const fileInput = document.getElementById('upload-file');
      if (!fileInput.files[0]) return;

      const btn = document.getElementById('btn-upload');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';

      const formData = new FormData();
      formData.append('label', label);
      formData.append('ground_truth', gt);
      formData.append('file', fileInput.files[0]);

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        if (res.ok) {
          fileInput.value = '';
          document.getElementById('upload-label').value = '';
          const data = await res.json();
          renderDashboard(data);
        }
      } catch (err) {
        console.error('Upload failed:', err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-plus"></i> Upload & Add to Pipeline';
      }
    });

    function renderDashboard(data) {
      const benchmarkTable = document.getElementById('benchmark-table-body');
      benchmarkTable.innerHTML = '';

      const audios = data.audios || [];

      if (audios.length === 0) {
        benchmarkTable.innerHTML = '<tr><td colspan="6" class="py-10 text-center text-slate-500"><i class="fa-solid fa-microphone-slash text-2xl mb-2 text-slate-600 block"></i>No data available. Upload an audio file to start benchmarking!</td></tr>';
        return;
      }

      // Render Benchmark Table
      audios.forEach(item => {
        const gt = item.ground_truth || 'UNKNOWN';
        const gtClass = gt === 'REAL_HUMAN' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : (gt === 'FAKE_SPOOF' ? 'bg-rose-500/20 text-rose-400 border-rose-500/30' : 'bg-slate-700 text-slate-300 border-slate-600');
        const gtText = gt === 'REAL_HUMAN' ? 'REAL VOICE' : (gt === 'FAKE_SPOOF' ? 'FAKE / SPOOF' : 'UNKNOWN');

        const raw = item.rawnet2 || {};
        const aas = item.aasist || {};

        const makeModelBadge = (modelData, defaultScore) => {
          const isReal = modelData.is_real !== undefined 
            ? modelData.is_real 
            : (modelData.is_spoof !== undefined ? !modelData.is_spoof : true);

          let realScore = modelData.real_score_pct !== undefined 
            ? modelData.real_score_pct 
            : (modelData.real_score_percentage !== undefined 
                ? modelData.real_score_percentage 
                : (modelData.spoof_risk_pct !== undefined 
                    ? (100 - modelData.spoof_risk_pct) 
                    : defaultScore));
          realScore = Number(realScore).toFixed(1);
          const isCorr = modelData.is_correct;
          const lat = modelData.latency_ms || 0.5;

          const predClass = isReal ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20';
          const predTxt = isReal ? 'REAL' : 'SPOOF';

          let corrIcon = '';
          if (isCorr === true) corrIcon = '<span class="text-emerald-400 font-bold ml-1 text-xs" title="Correct Prediction">✓</span>';
          else if (isCorr === false) corrIcon = '<span class="text-rose-400 font-bold ml-1 text-xs" title="Incorrect Prediction">✗</span>';

          return `<div class="flex items-center gap-1.5"><span class="px-2 py-0.5 rounded text-[11px] font-bold border ${predClass}">${predTxt} (${realScore}%)${corrIcon}</span> <span class="text-[10px] text-slate-400 font-mono">${lat}ms</span></div>`;
        };

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="py-2.5 px-3 font-semibold text-white">
            <div>${item.label}</div>
            <div class="text-[10px] text-slate-500 font-mono">${item.filename} (${item.raw_duration}s)</div>
          </td>
          <td class="py-2.5 px-3">
            <audio controls src="${item.raw_url}?t=${Date.now()}" class="w-36 h-8"></audio>
          </td>
          <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold border ${gtClass}">${gtText}</span></td>
          <td class="py-2.5 px-3">${makeModelBadge(raw, 0)}</td>
          <td class="py-2.5 px-3">${makeModelBadge(aas, 0)}</td>
          <td class="py-2.5 px-3 text-right">
            <button onclick="deleteSingleAudio('${item.raw_filename}')" title="Delete audio" class="text-slate-400 hover:text-rose-400 bg-slate-900 hover:bg-rose-500/20 border border-slate-700 hover:border-rose-500/30 p-1.5 rounded transition text-xs">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        benchmarkTable.appendChild(tr);
      });
    }

    // Initial load on page ready
    window.addEventListener('DOMContentLoaded', loadData);
  </script>

</body>
</html>
