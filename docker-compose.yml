services:
  altur-voice-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: altur_voice_biometrics
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Mount Data folder for manifests, audio, and benchmark results
      - ./Data:/app/Data
      # Mount web UI folder for live frontend updates
      - ./web:/app/web
      # Mount app.py and src for live backend updates
      - ./app.py:/app/app.py
      - ./src:/app/src
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
