services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackmty-api
    ports:
      - "8000:8000"
      - "8888:8888"
    environment:
      - APP_NAME=mergeConflict
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - CALIBRATED_THRESHOLD=0.50
    restart: unless-stopped
