services:
  altur-voice-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: altur_voice_anti_spoofing
    ports:
      - "${PORT:-8080}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - CALIBRATED_THRESHOLD=0.9623
      - TARGET_SAMPLE_RATE=16000
      - TELEPHONY_SAMPLE_RATE=8000
      - MAX_AUDIO_SIZE_MB=15
      - ENABLE_S3_AUDIT=${ENABLE_S3_AUDIT:-false}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_AUDIT_BUCKET=${S3_AUDIT_BUCKET:-antispoofing-audio-audit-altur}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      # Mount weights, source code, and data for live reload/updates
      - ./src:/app/src
      - ./weights:/app/weights
      - ./web:/app/web
      - ./Data:/app/Data
      - ./app.py:/app/app.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
